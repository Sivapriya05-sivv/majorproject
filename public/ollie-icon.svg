<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="ollieBody" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#9366f9"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </radialGradient>
    <radialGradient id="ollieBelly" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef9c3"/>
      <stop offset="100%" stop-color="#fef08a"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#4c1d95" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Feet -->
  <ellipse cx="80" cy="178" rx="14" ry="7" fill="#f59e0b" />
  <ellipse cx="120" cy="178" rx="14" ry="7" fill="#f59e0b" />

  <!-- Body -->
  <g filter="url(#shadow)">
    <!-- Main Body Shape -->
    <path d="M100 20 C60 20 40 50 40 105 C40 150 65 175 100 175 C135 175 160 150 160 105 C160 50 140 20 100 20 Z" fill="url(#ollieBody)"/>
    
    <!-- Feather Tufts / Ears -->
    <path d="M55 35 L40 15 L70 25 Z" fill="#6d28d9"/>
    <path d="M145 35 L160 15 L130 25 Z" fill="#6d28d9"/>

    <!-- Soft Belly -->
    <ellipse cx="100" cy="120" rx="42" ry="45" fill="url(#ollieBelly)"/>

    <!-- Belly Feather Marks -->
    <path d="M90 105 Q100 112 110 105" stroke="#eab308" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M85 122 Q100 130 115 122" stroke="#eab308" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M90 140 Q100 147 110 140" stroke="#eab308" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- Left Wing (Friendly rest) -->
    <path d="M42 95 C30 115 35 145 52 150 C50 135 48 115 42 95 Z" fill="#7c3aed"/>
    <!-- Right Wing (Friendly wave) -->
    <path d="M158 95 C170 80 180 60 170 50 C155 55 150 80 158 95 Z" fill="#7c3aed"/>

    <!-- Eye Sockets (White background) -->
    <circle cx="78" cy="72" r="24" fill="#ffffff"/>
    <circle cx="122" cy="72" r="24" fill="#ffffff"/>

    <!-- Purple Eye Rings -->
    <circle cx="78" cy="72" r="24" stroke="#c4b5fd" stroke-width="3" fill="none"/>
    <circle cx="122" cy="72" r="24" stroke="#c4b5fd" stroke-width="3" fill="none"/>

    <!-- Pupils (Warm deep purple) -->
    <circle cx="82" cy="73" r="14" fill="#1e1b4b"/>
    <circle cx="118" cy="73" r="14" fill="#1e1b4b"/>

    <!-- Sparkle Highlights in Eyes -->
    <circle cx="86" cy="69" r="5" fill="#ffffff"/>
    <circle cx="80" cy="77" r="2.5" fill="#ffffff"/>
    <circle cx="122" cy="69" r="5" fill="#ffffff"/>
    <circle cx="116" cy="77" r="2.5" fill="#ffffff"/>

    <!-- Rosy Cheeks -->
    <ellipse cx="60" cy="92" rx="8" ry="5" fill="#f472b6" opacity="0.6"/>
    <ellipse cx="140" cy="92" rx="8" ry="5" fill="#f472b6" opacity="0.6"/>

    <!-- Golden Orange Beak -->
    <polygon points="100,75 92,92 108,92" fill="#f59e0b"/>
    <polygon points="100,98 94,92 106,92" fill="#d97706"/>
  </g>
</svg>

